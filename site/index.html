<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saboriê Doces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;}
  html{
    scroll-behavior:smooth;
  }
  html, body{
    max-width:100%;
    overflow-x:hidden;
  }
  #catalogo{
    scroll-margin-top:96px;
  }
  body{
    margin:0;
    font-family:'Poppins', sans-serif;
    background:#f4f1ec;
  }

  .page{
    max-width:1360px;
    margin:0 auto;
    padding:40px 24px;
  }
  @media (max-width: 480px){
    .page{ padding:24px 12px; }
  }

  /* ---- Barra de navegação ---- */
  .navbar{
    background: linear-gradient(90deg, #fdeef2 0%, #ffffff 60%);
    padding:16px 40px;
    position:sticky;
    top:0;
    z-index:90;
    box-shadow:0 4px 16px rgba(0,0,0,.05);
    overflow-x:hidden;
  }
  .navbar-inner{
    max-width:1360px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:24px;
  }
  .navbar-logo{
    width:48px;
    height:48px;
    border-radius:50%;
    object-fit:cover;
    flex-shrink:0;
    display:block;
  }
  .navbar-links{
    display:flex;
    gap:28px;
  }
  .navbar-links a{
    color:#2a2420;
    text-decoration:none;
    font-size:.9rem;
    font-weight:500;
  }
  .navbar-links a:hover{ color:#e58fb0; }
  .navbar-cart{
    display:flex;
    align-items:center;
    gap:6px;
    background:#e58fb0;
    color:#fff;
    border:none;
    border-radius:999px;
    padding:10px 22px;
    font-weight:600;
    font-size:.85rem;
    font-family:'Poppins', sans-serif;
    cursor:pointer;
    flex-shrink:0;
  }
  .navbar-cart:hover{ opacity:.9; }

  @media (max-width: 700px){
    .navbar{ padding:10px 12px; }
    .navbar-inner{ gap:6px; }
    .navbar-logo{ width:42px; height:42px; flex-shrink:0; }
    .navbar-links{ gap:16px; flex-shrink:1; min-width:0; }
    .navbar-links a{ font-size:.95rem; white-space:nowrap; }
    .navbar-cart{
      width:40px;
      height:40px;
      padding:0;
      border-radius:50%;
      justify-content:center;
      font-size:1.2rem;
      flex-shrink:0;
    }
    .cart-label{ display:none; }
  }
  @media (max-width: 400px){
    .navbar-logo{ width:38px; height:38px; }
    .navbar-links{ gap:12px; }
    .navbar-links a{ font-size:.88rem; }
    .navbar-cart{ width:36px; height:36px; font-size:1.1rem; }
  }

  /* ---- Seção topo: melhores bolos ---- */
  .promo-banner{
    display:flex;
    align-items:center;
    gap:36px;
    min-height:220px;
    padding:32px 60px;
    border-radius:28px;
    overflow:hidden;
    margin-bottom:36px;
    box-shadow:0 24px 50px rgba(0,0,0,.10);
    background: linear-gradient(120deg, #fdf3da 0%, #fbdce8 55%, #f7c3d7 100%);
    position:relative;
  }
  .promo-banner-badge{
    flex-shrink:0;
    width:150px;
    height:150px;
    border-radius:50%;
    background:#fff;
    padding:6px;
    box-shadow:0 10px 24px rgba(0,0,0,.10);
  }
  .badge-logo{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
  }
  .promo-banner-text h2{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:2.6rem;
    line-height:1.05;
    color:#2a2420;
    margin:0 0 10px;
  }
  .promo-banner-text h2 .squiggle{
    color:#e58fb0;
    font-size:1.6rem;
  }
  .promo-banner-text .script{
    font-family:'Poppins', sans-serif;
    font-style:italic;
    font-weight:400;
    font-size:1.15rem;
    color:#6b6259;
    margin:0;
  }

  @media (max-width: 860px){
    .promo-banner{ flex-direction:column; text-align:center; padding:36px 24px; }
  }
  @media (max-width: 480px){
    .promo-banner{ padding:28px 20px; gap:20px; border-radius:20px; }
    .promo-banner-badge{ width:110px; height:110px; }
    .promo-banner-text h2{ font-size:1.9rem; }
    .promo-banner-text .script{ font-size:1rem; }
  }

  /* ---- Seção Premium / Bakery ---- */
  .bakery-promo{
    display:grid;
    grid-template-columns: 1fr 1fr;
    align-items:center;
    min-height:480px;
    background: linear-gradient(120deg, #fdf3da 0%, #fbdce8 55%, #f7c3d7 100%);
    padding: 40px 60px;
    position:relative;
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 24px 50px rgba(0,0,0,.10);
    margin-bottom:36px;
  }
  .promo-text{ max-width:460px; }
  .promo-text h2{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:3.4rem;
    line-height:1.1;
    color:#2a2420;
    margin:0 0 20px;
  }
  .promo-text p{
    color:#6b6259;
    font-size:1rem;
    line-height:1.6;
    margin-bottom:30px;
    max-width:380px;
  }
  .promo-actions{ display:flex; gap:16px; flex-wrap:wrap; }
  .btn{
    display:inline-block;
    padding:14px 30px;
    border-radius:999px;
    font-size:.9rem;
    font-weight:600;
    text-decoration:none;
    transition:opacity .2s;
  }
  .btn-solid{ background:#e58fb0; color:#fff; }
  .btn-outline{ background:#fff; color:#2a2420; box-shadow:0 4px 14px rgba(0,0,0,.08); }
  .btn:hover{ opacity:.85; }

  .promo-visual{
    position:relative;
    height:70%;
    min-height:360px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .promo-image{
    width:82%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:16px;
    display:block;
  }
  .floating-dot{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle at 30% 30%, #fff, #f0b8cc);
  }
  .dot-1{ width:26px; height:26px; left:6%; bottom:20%; }
  .dot-2{ width:16px; height:16px; left:18%; bottom:9%; }

  @media (max-width: 860px){
    .bakery-promo{ grid-template-columns:1fr; padding:60px 24px; text-align:center; min-height:auto; }
    .promo-text{ margin:0 auto; }
    .promo-actions{ justify-content:center; }
    .promo-visual{ margin-top:40px; min-height:280px; }
  }
  @media (max-width: 480px){
    .bakery-promo{ padding:36px 20px; border-radius:20px; }
    .promo-text h2{ font-size:2.3rem; }
    .promo-visual{ min-height:220px; }
    .promo-image{ width:92%; }
  }

  /* ---- Seção Catálogo ---- */
  .catalog{
    background:#fdf8f2;
    border-radius:28px;
    box-shadow:0 24px 50px rgba(0,0,0,.10);
    padding:48px 60px;
  }
  .catalog-title{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:2rem;
    color:#2a2420;
    margin:0 0 32px;
    text-align:center;
  }
  .catalog-tabs{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    margin-bottom:32px;
  }
  .tab-btn{
    border:1px solid rgba(42,36,32,.2);
    background:#fff;
    color:#2a2420;
    border-radius:999px;
    padding:10px 22px;
    font-family:'Poppins', sans-serif;
    font-size:.85rem;
    font-weight:600;
    cursor:pointer;
    transition:background .2s, color .2s;
  }
  .tab-btn.active{
    background:#2a2420;
    border-color:#2a2420;
    color:#fff;
  }
  .catalog-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:24px;
  }
  .product-card{
    background:#fff;
    border-radius:16px;
    box-shadow:0 8px 20px rgba(0,0,0,.06);
    padding:16px;
    display:flex;
    flex-direction:column;
  }
  .product-image{
    aspect-ratio:1/1;
    width:100%;
    object-fit:cover;
    border-radius:12px;
    margin-bottom:14px;
    background:#faf6f2;
    display:block;
  }
  .product-name{
    font-weight:600;
    font-size:.95rem;
    color:#2a2420;
    margin:0 0 4px;
  }
  .product-desc{
    font-size:.78rem;
    color:#8a8078;
    line-height:1.4;
    margin:0 0 10px;
    flex-grow:1;
  }
  .product-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .product-price{
    font-weight:700;
    color:#e58fb0;
    font-size:.95rem;
  }
  .product-add{
    border:none;
    background:#2a2420;
    color:#fff;
    border-radius:999px;
    padding:8px 16px;
    font-size:.78rem;
    font-weight:600;
    cursor:pointer;
    transition:opacity .2s;
  }
  .product-add:hover{ opacity:.85; }

  @media (max-width: 1080px){
    .catalog-grid{ grid-template-columns:repeat(2, 1fr); }
  }
  @media (max-width: 860px){
    .catalog{ padding:40px 24px; border-radius:20px; }
  }
  @media (max-width: 520px){
    .catalog-grid{ grid-template-columns:repeat(2, 1fr); gap:14px; }
    .catalog{ padding:28px 16px; }
    .catalog-title{ font-size:1.5rem; margin-bottom:24px; }
    .catalog-tabs{ gap:8px; margin-bottom:24px; }
    .tab-btn{ padding:8px 16px; font-size:.75rem; }
    .product-card{ padding:10px; }
    .product-name{ font-size:.85rem; }
    .product-desc{ font-size:.7rem; }
    .product-price{ font-size:.85rem; }
    .product-add{ padding:6px 10px; font-size:.68rem; }
    .product-footer{ flex-wrap:wrap; gap:6px; }
  }

  /* ---- Carrinho flutuante ---- */
  .cart-fab{
    position:fixed;
    right:28px;
    bottom:28px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#e58fb0;
    color:#fff;
    border:none;
    box-shadow:0 10px 24px rgba(0,0,0,.2);
    font-size:1.4rem;
    cursor:pointer;
    z-index:95;
  }
  .cart-count{
    position:absolute;
    top:-4px; right:-4px;
    background:#2a2420;
    color:#fff;
    font-size:.7rem;
    font-weight:700;
    border-radius:999px;
    min-width:20px;
    height:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 5px;
  }

  .cart-overlay{
    position:fixed;
    inset:0;
    background:rgba(42,36,32,.35);
    opacity:0;
    pointer-events:none;
    transition:opacity .25s;
    z-index:97;
  }
  .cart-overlay.open{ opacity:1; pointer-events:auto; }

  .cart-drawer{
    position:fixed;
    top:0; right:0;
    height:100%;
    width:380px;
    max-width:92vw;
    background:#fdf8f2;
    box-shadow:-12px 0 40px rgba(0,0,0,.15);
    transform:translateX(100%);
    transition:transform .3s;
    z-index:98;
    display:flex;
    flex-direction:column;
    padding:28px 24px;
  }
  .cart-drawer.open{ transform:translateX(0); }

  .cart-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
  }
  .cart-header h3{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    color:#2a2420;
    margin:0;
  }
  .cart-close{
    border:none;
    background:none;
    font-size:1.4rem;
    cursor:pointer;
    color:#2a2420;
    line-height:1;
  }
  .cart-items{
    flex-grow:1;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .cart-empty{
    color:#8a8078;
    font-size:.9rem;
    text-align:center;
    margin-top:40px;
  }
  .cart-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:#fff;
    border-radius:12px;
    padding:10px 12px;
  }
  .cart-item-name{
    font-size:.85rem;
    font-weight:600;
    color:#2a2420;
    margin:0 0 2px;
  }
  .cart-item-price{
    font-size:.78rem;
    color:#8a8078;
  }
  .cart-item-qty{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .qty-btn{
    width:24px; height:24px;
    border-radius:50%;
    border:1px solid rgba(42,36,32,.25);
    background:#fff;
    cursor:pointer;
    font-size:.85rem;
    line-height:1;
  }
  .cart-footer{
    border-top:1px solid rgba(42,36,32,.1);
    padding-top:16px;
    margin-top:16px;
  }
  .cart-total{
    display:flex;
    justify-content:space-between;
    font-weight:700;
    color:#2a2420;
    margin-bottom:14px;
  }
  .cart-checkout{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    width:100%;
    border:none;
    background:#25d366;
    color:#fff;
    font-weight:600;
    font-size:.9rem;
    padding:14px;
    border-radius:999px;
    cursor:pointer;
  }
  .cart-checkout:disabled{
    background:#c8c0b8;
    cursor:not-allowed;
  }

  @media (max-width: 480px){
    .cart-fab{ right:16px; bottom:16px; width:52px; height:52px; font-size:1.2rem; }
    .cart-drawer{ padding:20px 16px; }
  }
</style>
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <img src="assets/logo.jpg" alt="Saboriê Doces" class="navbar-logo">
    <nav class="navbar-links" id="navbar-links">
      <a href="#">Início</a>
      <a href="#catalogo">Produtos</a>
      <a href="https://wa.me/5519993300237" target="_blank" rel="noopener">Contato</a>
    </nav>
    <button class="navbar-cart" id="navbar-cart-btn">🛒<span class="cart-label"> Carrinho</span></button>
  </div>
</header>

<div class="page">

<section class="promo-banner">
  <div class="promo-banner-badge">
    <img src="assets/logo.jpg" alt="Saboriê Doces" class="badge-logo">
  </div>
  <div class="promo-banner-text">
    <h2>Os melhores<br>bolos! <span class="squiggle"></span></h2>
    <p class="script">Satisfaça sua vontade de doce</p>
  </div>
</section>

<section class="bakery-promo">
  <div class="promo-text">
    <h2>Doces<br>Artesanais</h2>
    <p>
      Bolos e doces artesanais feitos à mão, com ingredientes selecionados
      e todo o carinho da Saboriê Doces em cada detalhe.
    </p>
    <div class="promo-actions">
      <a class="btn btn-solid" href="#catalogo">Peça agora</a>
    </div>
  </div>

  <div class="promo-visual">
    <img class="promo-image" src="assets/bolo-macarons.png" alt="Doces Saboriê Doces">
    <span class="floating-dot dot-1"></span>
    <span class="floating-dot dot-2"></span>
  </div>
</section>

<section class="catalog" id="catalogo">
  <h2 class="catalog-title">Nosso Cardápio</h2>
  <div class="catalog-tabs" id="catalog-tabs">
    <button class="tab-btn active" data-category="todos">Todos</button>
    <button class="tab-btn" data-category="bolos">Bolos</button>
    <button class="tab-btn" data-category="bolos-de-pote">Bolos de Pote</button>
    <button class="tab-btn" data-category="brigadeiros">Brigadeiros</button>
  </div>
  <div class="catalog-grid" id="catalog-grid"></div>
</section>

</div>

<button class="cart-fab" id="cart-fab" aria-label="Abrir carrinho">
  🛒
  <span class="cart-count" id="cart-count">0</span>
</button>

<div class="cart-overlay" id="cart-overlay"></div>
<aside class="cart-drawer" id="cart-drawer">
  <div class="cart-header">
    <h3>Seu pedido</h3>
    <button class="cart-close" id="cart-close" aria-label="Fechar carrinho">×</button>
  </div>
  <div class="cart-items" id="cart-items"></div>
  <div class="cart-footer">
    <div class="cart-total">
      <span>Total</span>
      <span id="cart-total-value">R$ 0,00</span>
    </div>
    <button class="cart-checkout" id="cart-checkout" disabled>
      Enviar pedido no WhatsApp
    </button>
  </div>
</aside>

<script>
  const WHATSAPP_NUMBER = "5519993300237";

  const products = [
    { id: 1, name: "Bolo de Chocolate", desc: "Massa fofinha, cobertura de ganache", price: 45.00, category: "bolos", image: "assets/bolo-chocolate.png" },
    { id: 2, name: "Bolo Red Velvet", desc: "Recheio de cream cheese", price: 55.00, category: "bolos", image: "assets/bolo-red-velvet.png" },
    { id: 3, name: "Bolo de Cenoura com Brigadeiro", desc: "Clássico, cobertura crocante", price: 40.00, category: "bolos", image: "assets/bolo-cenoura-brigadeiro.png" },
    { id: 4, name: "Bolo no Pote Ninho com Nutella", desc: "Camadas de bolo, leite ninho e nutella", price: 15.00, category: "bolos-de-pote", image: "assets/pote-ninho-nutella.png" },
    { id: 5, name: "Bolo no Pote Prestígio", desc: "Chocolate e coco cremoso", price: 15.00, category: "bolos-de-pote", image: "assets/pote-prestigio.png" },
    { id: 6, name: "Bolo no Pote de Limão", desc: "Leve, com raspas de limão", price: 14.00, category: "bolos-de-pote", image: "assets/pote-limao.png" },
    { id: 7, name: "Brigadeiro Gourmet Tradicional", desc: "Chocolate belga, granulado nobre", price: 6.00, category: "brigadeiros", image: "assets/brigadeiro-tradicional.png" },
    { id: 8, name: "Brigadeiro de Pistache", desc: "Recheio cremoso de pistache", price: 7.50, category: "brigadeiros", image: "assets/brigadeiro-pistache.png" },
    { id: 9, name: "Brigadeiro de Maracujá", desc: "Toque tropical e azedinho", price: 6.50, category: "brigadeiros", image: "assets/brigadeiro-maracuja.png" }
  ];

  let activeCategory = "todos";
  const cart = {};

  const catalogGrid = document.getElementById("catalog-grid");
  const catalogTabs = document.getElementById("catalog-tabs");
  const cartItemsEl = document.getElementById("cart-items");
  const cartCountEl = document.getElementById("cart-count");
  const cartTotalEl = document.getElementById("cart-total-value");
  const cartCheckoutBtn = document.getElementById("cart-checkout");
  const cartDrawer = document.getElementById("cart-drawer");
  const cartOverlay = document.getElementById("cart-overlay");

  function formatBRL(value){
    return "R$ " + value.toFixed(2).replace(".", ",");
  }

  function renderCatalog(){
    const visible = activeCategory === "todos"
      ? products
      : products.filter(p => p.category === activeCategory);

    catalogGrid.innerHTML = visible.map(p => `
      <div class="product-card">
        <img class="product-image" src="${p.image}" alt="${p.name}">
        <p class="product-name">${p.name}</p>
        <p class="product-desc">${p.desc}</p>
        <div class="product-footer">
          <span class="product-price">${formatBRL(p.price)}</span>
          <button class="product-add" data-id="${p.id}">+ Adicionar</button>
        </div>
      </div>
    `).join("");

    catalogGrid.querySelectorAll(".product-add").forEach(btn => {
      btn.addEventListener("click", () => addToCart(Number(btn.dataset.id)));
    });
  }

  function addToCart(id){
    cart[id] = (cart[id] || 0) + 1;
    renderCart();
    openCart();
  }

  function changeQty(id, delta){
    if(!cart[id]) return;
    cart[id] += delta;
    if(cart[id] <= 0) delete cart[id];
    renderCart();
  }

  function renderCart(){
    const ids = Object.keys(cart);
    let total = 0;
    let count = 0;

    if(ids.length === 0){
      cartItemsEl.innerHTML = '<p class="cart-empty">Seu carrinho está vazio</p>';
    } else {
      cartItemsEl.innerHTML = ids.map(id => {
        const product = products.find(p => p.id === Number(id));
        const qty = cart[id];
        const subtotal = product.price * qty;
        total += subtotal;
        count += qty;
        return `
          <div class="cart-item">
            <div>
              <p class="cart-item-name">${product.name}</p>
              <span class="cart-item-price">${formatBRL(product.price)} un.</span>
            </div>
            <div class="cart-item-qty">
              <button class="qty-btn" data-id="${id}" data-delta="-1">−</button>
              <span>${qty}</span>
              <button class="qty-btn" data-id="${id}" data-delta="1">+</button>
            </div>
          </div>
        `;
      }).join("");
    }

    cartCountEl.textContent = count;
    cartTotalEl.textContent = formatBRL(total);
    cartCheckoutBtn.disabled = count === 0;

    cartItemsEl.querySelectorAll(".qty-btn").forEach(btn => {
      btn.addEventListener("click", () => changeQty(Number(btn.dataset.id), Number(btn.dataset.delta)));
    });
  }

  function openCart(){
    cartDrawer.classList.add("open");
    cartOverlay.classList.add("open");
  }
  function closeCart(){
    cartDrawer.classList.remove("open");
    cartOverlay.classList.remove("open");
  }

  document.getElementById("cart-fab").addEventListener("click", openCart);
  document.getElementById("navbar-cart-btn").addEventListener("click", openCart);
  document.getElementById("cart-close").addEventListener("click", closeCart);
  cartOverlay.addEventListener("click", closeCart);

  cartCheckoutBtn.addEventListener("click", () => {
    const ids = Object.keys(cart);
    if(ids.length === 0) return;

    let message = "Olá! Gostaria de fazer o seguinte pedido na Saboriê Doces:%0A%0A";
    let total = 0;
    ids.forEach(id => {
      const product = products.find(p => p.id === Number(id));
      const qty = cart[id];
      const subtotal = product.price * qty;
      total += subtotal;
      message += `${qty}x ${product.name} - ${formatBRL(subtotal)}%0A`;
    });
    message += `%0ATotal: ${formatBRL(total)}`;

    window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${message}`, "_blank");
  });

  catalogTabs.querySelectorAll(".tab-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.category;
      catalogTabs.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderCatalog();
    });
  });

  renderCatalog();
  renderCart();
</script>

</body>
</html>
